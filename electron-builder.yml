appId: com.example.sshterminal
productName: SSHTerminal
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SSHTerminal

npmRebuild: false
